);

/* LOAD USER */

async function loadUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;
}

loadUser();

/* QUIZ ANSWER */

async function answer(correct) {

    const result =
        document.getElementById("quiz-result");

    if (correct) {

        result.innerHTML =
            "✅ Correct! Sehr gut!";

        result.style.color = "green";

    } else {

        result.innerHTML =
            "❌ Try again!";

        result.style.color = "red";

    }

    if (!currentUser) {
        console.log("User not logged in");
        return;
    }

    const score = correct ? 1 : 0;
    const total = 1;

    const { error } =
        await supabaseClient
        .from("quiz_results")
        .insert({

            user_id: currentUser.id,
            score: score,
            total: total

        });

    if (error) {

        console.log(
            "Quiz save error:",
            error.message
        );

    } else {

        console.log(
            "Quiz result saved!"
        );

    }

}


/* COMPLETE LESSON */

async function completeLesson(lessonName) {

    if (!currentUser) {

        alert("Please login first.");

        return;
    }

    const { error } =
        await supabaseClient
        .from("lesson_progress")
        .upsert({

            user_id: currentUser.id,
            lesson_name: lessonName,
            completed: true

        });

    if (error) {

        alert(
            "Error: " + error.message
        );

        return;
    }

    alert("✅ Lesson completed!");

}
