<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeutschStart A1 🇩🇪</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    font-size: 24px;
}

.hero {
    background: linear-gradient(135deg, #172033, #31456b);
    color: white;
    text-align: center;
    padding: 45px 20px;
}

.hero h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 18px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #3157a5;
    text-decoration: none;
    font-weight: bold;
}

.lesson-menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 30px;
}

.menu-button {
    background: white;
    border: none;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    font-size: 16px;
    font-weight: bold;
    color: #172033;
    cursor: pointer;
}

.menu-button:hover {
    background: #eef2f8;
}

.lesson {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.lesson h2 {
    margin-bottom: 15px;
}

.lesson h3 {
    margin-top: 25px;
    margin-bottom: 12px;
}

.lesson p {
    line-height: 1.6;
    margin-bottom: 12px;
}

.words {
    background: #eef2f8;
    padding: 18px;
    border-radius: 10px;
    line-height: 2;
    margin-bottom: 15px;
}

.example {
    background: #f8f9fb;
    border-left: 5px solid #3157a5;
    padding: 18px;
    margin-top: 15px;
    border-radius: 8px;
}

.conversation {
    background: #eef2f8;
    padding: 18px;
    border-radius: 10px;
    line-height: 1.9;
}

.complete-button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.complete-button:hover {
    background: #15803d;
}

.home-button {
    display: inline-block;
    background: #ffcc00;
    color: #172033;
    padding: 13px 22px;
    border-radius: 9px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 10px;
}

footer {
    background: #172033;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

.option {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1px solid #d5dbea;
    background: white;
    border-radius: 9px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.option:hover {
    background: #eef2f8;
}

.result {
    margin-top: 15px;
    font-weight: bold;
}

@media (max-width: 600px) {

    .lesson-menu {
        grid-template-columns: 1fr;
    }

    .hero h2 {
        font-size: 27px;
    }

}

</style>
</head>


<body>

<header>
    <h1>🇩🇪 DeutschStart</h1>
</header>


<section class="hero">

    <h2>A1 German</h2>

    <p>
        Learn German step by step.
    </p>

</section>


<div class="container">

<a class="back" href="index.html">
    ← Back to Home
</a>


<h2 style="margin-bottom:15px;">
    📚 A1 Lessons
</h2>


<div class="lesson-menu">

    <button class="menu-button"
        onclick="showLesson('greetings')">
        👋 Greetings
    </button>

    <button class="menu-button"
        onclick="showLesson('intro')">
        🙋 Introduction
    </button>

    <button class="menu-button"
        onclick="showLesson('numbers')">
        🔢 Numbers
    </button>

    <button class="menu-button"
        onclick="showLesson('family')">
        👨‍👩‍👧 Family
    </button>

    <button class="menu-button"
        onclick="showLesson('home')">
        🏠 Home
    </button>

    <button class="menu-button"
        onclick="showLesson('food')">
        🍎 Food
    </button>

    <button class="menu-button"
        onclick="showLesson('routine')">
        🕐 Daily Routine
    </button>

    <button class="menu-button"
        onclick="showLesson('grammar')">
        📚 Grammar
    </button>

    <button class="menu-button"
        onclick="showLesson('speaking')">
        🗣️ Speaking
    </button>

    <button class="menu-button"
        onclick="showLesson('quiz')">
        📝 A1 Quiz
    </button>

</div>


<div id="lesson-area">

    <div class="lesson">

        <h2>
            👋 Welcome to A1!
        </h2>

        <p>
            Select a lesson above to start learning German.
        </p>

    </div>

</div>


<a class="home-button" href="index.html">
    🏠 Home
</a>

</div>


<footer>

    <p>
        © 2026 DeutschStart 🇩🇪
    </p>

    <p>
        Learn German A1 → B2
    </p>

</footer>


<script>

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

let currentUser = null;


async function loadUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {

        window.location.href =
            "login.html";

        return;
    }

    currentUser = user;
}

loadUser();


async function completeLesson(lessonName) {

    if (!currentUser) {

        alert("Please login first.");

        return;
    }

    const { error } =
        await supabaseClient
        .from("lesson_progress")
        .upsert({
            user_id: currentUser.id,
            lesson_name: lessonName,
            completed: true
        });

    if (error) {

        alert(
            "Error: " +
            error.message
        );

        return;
    }

    alert(
        "✅ " +
        lessonName +
        " lesson completed!"
    );
}


function showLesson(lesson) {

    const area =
        document.getElementById(
            "lesson-area"
        );


    /* =========================
       GREETINGS
    ========================= */

    if (lesson === "greetings") {

        area.innerHTML = `

        <div class="lesson">

            <h2>
                👋 Greetings – Begrüßungen
            </h2>

            <p>
                Learn common German greetings,
                questions and ways to say goodbye.
            </p>


            <h3>
                🌅 Morning
            </h3>

            <div class="words">

                <b>Guten Morgen!</b>
                — Good morning!<br>

                <b>Morgen!</b>
                — Morning! (informal)<br>

                <b>Einen schönen guten Morgen!</b>
                — Have a nice morning!

            </div>


            <h3>
                ☀️ During the Day
            </h3>

            <div class="words">

                <b>Hallo!</b>
                — Hello!<br>

                <b>Guten Tag!</b>
                — Good day!<br>

                <b>Hi!</b>
                — Hi!<br>

                <b>Hey!</b>
                — Hey!<br>

                <b>Grüß dich!</b>
                — Hello! (informal)<br>

                <b>Grüß Gott!</b>
                — Hello! (formal/regional)<br>

                <b>Mahlzeit!</b>
                — Hello / Good day!

            </div>


            <h3>
                🌆 Evening
            </h3>

            <div class="words">

                <b>Guten Abend!</b>
                — Good evening!<br>

                <b>Einen schönen Abend!</b>
                — Have a nice evening!<br>

                <b>Schönen Abend noch!</b>
                — Have a nice evening!

            </div>


            <h3>
                🌙 Night
            </h3>

            <div class="words">

                <b>Gute Nacht!</b>
                — Good night!<br>

                <b>Schlaf gut!</b>
                — Sleep well!<br>

                <b>Träum schön!</b>
                — Sweet dreams!

            </div>


            <h3>
                👋 Saying Goodbye
            </h3>

            <div class="words">

                <b>Auf Wiedersehen!</b>
                — Goodbye!<br>

                <b>Tschüss!</b>
                — Bye!<br>

                <b>Ciao!</b>
                — Bye!<br>

                <b>Bis bald!</b>
                — See you soon!<br>

                <b>Bis später!</b>
                — See you later!<br>

                <b>Bis morgen!</b>
                — See you tomorrow!<br>

                <b>Bis gleich!</b>
                — See you shortly!<br>

                <b>Bis nächste Woche!</b>
                — See you next week!<br>

                <b>Mach's gut!</b>
                — Take care!<br>

                <b>Macht's gut!</b>
                — Take care! (plural)<br>

                <b>Auf Wiederhören!</b>
                — Goodbye! (on the phone)

            </div>


            <h3>
                😊 Asking How Someone Is
            </h3>

            <div class="words">

                <b>Wie geht es dir?</b>
                — How are you? (informal)<br>

                <b>Wie geht's dir?</b>
                — How are you?<br>

                <b>Wie geht es Ihnen?</b>
                — How are you? (formal)<br>

                <b>Wie geht's?</b>
                — How are things?<br>

                <b>Alles gut?</b>
                — Everything okay?<br>

                <b>Wie geht's euch?</b>
                — How are you all?

            </div>


            <h3>
                ❤️ Answers
            </h3>

            <div class="words">

                <b>Mir geht es gut.</b>
                — I'm doing well.<br>

                <b>Mir geht's gut.</b>
                — I'm doing well.<br>

                <b>Sehr gut, danke!</b>
                — Very well, thank you!<br>

                <b>Danke, gut.</b>
                — Good, thanks.<br>

                <b>Es geht.</b>
                — So-so.<br>

                <b>Nicht schlecht.</b>
                — Not bad.<br>

                <b>Mir geht es sehr gut.</b>
                — I'm doing very well.<br>

                <b>Mir geht es nicht so gut.</b>
                — I'm not doing so well.<br>

                <b>Danke der Nachfrage.</b>
                — Thanks for asking.

            </div>


            <h3>
                🤝 Meeting Someone
            </h3>

            <div class="words">

                <b>Wie heißt du?</b>
                — What's your name?<br>

                <b>Wie heißen Sie?</b>
                — What's your name? (formal)<br>

                <b>Ich heiße Aswin.</b>
                — My name is Aswin.<br>

                <b>Freut mich!</b>
                — Nice to meet you!<br>

                <b>Sehr erfreut!</b>
                — Pleased to meet you!<br>

                <b>Schön, dich kennenzulernen.</b>
                — Nice to meet you.<br>

                <b>Schön, Sie kennenzulernen.</b>
                — Nice to meet you. (formal)

            </div>


            <h3>
                👔 Formal vs Informal
            </h3>

            <div class="example">

                <p>
                    <b>Informal:</b>
                </p>

                <p>
                    Hallo! Wie geht's dir?
                </p>

                <p>
                    Tschüss! Bis morgen!
                </p>


                <p>
                    <b>Formal:</b>
                </p>

                <p>
                    Guten Tag! Wie geht es Ihnen?
                </p>

                <p>
                    Auf Wiedersehen!
                </p>

            </div>


            <h3>
                🗣️ Mini Conversation
            </h3>

            <div class="conversation">

                <p>
                    <b>A:</b> Guten Morgen!
                </p>

                <p>
                    <b>B:</b>
                    Guten Morgen! Wie geht es dir?
                </p>

                <p>
                    <b>A:</b>
                    Mir geht es gut, danke. Und dir?
                </p>

                <p>
                    <b>B:</b>
                    Auch gut, danke!
                </p>

                <p>
                    <b>A:</b> Bis später!
                </p>

                <p>
                    <b>B:</b> Bis später!
                </p>

            </div>


            <button
                class="complete-button"
                onclick="completeLesson('Greetings')">

                ✅ Mark Greetings as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       INTRODUCTION
    ========================= */

    else if (lesson === "intro") {

        area.innerHTML = `

        <div class="lesson">

            <h2>🙋 Introduction</h2>

            <div class="words">

                <b>Ich heiße Aswin.</b><br>
                My name is Aswin.<br><br>

                <b>Ich bin 18 Jahre alt.</b><br>
                I am 18 years old.<br><br>

                <b>Ich komme aus Indien.</b><br>
                I come from India.<br><br>

                <b>Ich wohne in Wayanad.</b><br>
                I live in Wayanad.<br><br>

                <b>Ich bin Student.</b><br>
                I am a student.

            </div>

            <button
                class="complete-button"
                onclick="completeLesson('Introduction')">

                ✅ Mark Introduction as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       NUMBERS
    ========================= */

    else if (lesson === "numbers") {

        area.innerHTML = `

        <div class="lesson">

            <h2>🔢 Numbers</h2>

            <div class="words">

                eins — 1<br>
                zwei — 2<br>
                drei — 3<br>
                vier — 4<br>
                fünf — 5<br>
                sechs — 6<br>
                sieben — 7<br>
                acht — 8<br>
                neun — 9<br>
                zehn — 10<br>
                elf — 11<br>
                zwölf — 12<br>
                dreizehn — 13<br>
                vierzehn — 14<br>
                fünfzehn — 15<br>
                sechzehn — 16<br>
                siebzehn — 17<br>
                achtzehn — 18<br>
                neunzehn — 19<br>
                zwanzig — 20

            </div>

            <button
                class="complete-button"
                onclick="completeLesson('Numbers')">

                ✅ Mark Numbers as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       FAMILY
    ========================= */

    else if (lesson === "family") {

        area.innerHTML = `

        <div class="lesson">

            <h2>👨‍👩‍👧 Family</h2>

            <div class="words">

                die Familie — family<br>
                der Vater — father<br>
                die Mutter — mother<br>
                der Bruder — brother<br>
                die Schwester — sister<br>
                der Sohn — son<br>
                die Tochter — daughter<br>
                der Großvater — grandfather<br>
                die Großmutter — grandmother<br>
                die Eltern — parents<br>
                das Kind — child

            </div>

            <button
                class="complete-button"
                onclick="completeLesson('Family')">

                ✅ Mark Family as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       HOME
    ========================= */

    else if (lesson === "home") {

        area.innerHTML = `

        <div class="lesson">

            <h2>🏠 Home</h2>

            <div class="words">

                das Haus — house<br>
                die Wohnung — apartment<br>
                das Zimmer — room<br>
                die Küche — kitchen<br>
                das Bad — bathroom<br>
                das Schlafzimmer — bedroom<br>
                das Wohnzimmer — living room<br>
                der Tisch — table<br>
                der Stuhl — chair<br>
                das Bett — bed<br>
                die Tür — door<br>
                das Fenster — window

            </div>

            <button
                class="complete-button"
                onclick="completeLesson('Home')">

                ✅ Mark Home as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       FOOD
    ========================= */

    else if (lesson === "food") {

        area.innerHTML = `

        <div class="lesson">

            <h2>🍎 Food</h2>

            <div class="words">

                das Brot — bread<br>
                der Reis — rice<br>
                das Wasser — water<br>
                der Kaffee — coffee<br>
                der Tee — tea<br>
                der Apfel — apple<br>
                die Banane — banana<br>
                das Fleisch — meat<br>
                der Fisch — fish<br>
                das Gemüse — vegetables<br>
                das Essen — food

            </div>

            <button
                class="complete-button"
                onclick="completeLesson('Food')">

                ✅ Mark Food as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       DAILY ROUTINE
    ========================= */

    else if (lesson === "routine") {

        area.innerHTML = `

        <div class="lesson">

            <h2>🕐 Daily Routine</h2>

            <div class="words">

                <b>Ich stehe um 7 Uhr auf.</b><br>
                I get up at 7 o'clock.<br><br>

                <b>Ich frühstücke.</b><br>
                I have breakfast.<br><br>

                <b>Ich gehe zur Schule.</b><br>
                I go to school.<br><br>

                <b>Ich spiele Fußball.</b><br>
                I play football.<br><br>

                <b>Ich gehe um 22 Uhr schlafen.</b><br>
                I go to sleep at 10 PM.

            </div>

            <button
                class="complete-button"
                onclick="completeLesson('Daily Routine')">

                ✅ Mark Daily Routine as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       GRAMMAR
    ========================= */

    else if (lesson === "grammar") {

        area.innerHTML = `

        <div class="lesson">

            <h2>📚 Basic Grammar</h2>

            <h3>Personal Pronouns</h3>

            <div class="words">

                ich — I<br>
                du — you<br>
                er — he<br>
                sie — she<br>
                es — it<br>
                wir — we<br>
                ihr — you (plural)<br>
                sie — they<br>
                Sie — you (formal)

            </div>

            <h3>Examples</h3>

            <div class="example">

                <p>
                    Ich bin Student.
                </p>

                <p>
                    Du bist nett.
                </p>

                <p>
                    Er ist mein Freund.
                </p>

                <p>
                    Wir sind glücklich.
                </p>

            </div>

            <button
                class="complete-button"
                onclick="completeLesson('Grammar')">

                ✅ Mark Grammar as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       SPEAKING
    ========================= */

    else if (lesson === "speaking") {

        area.innerHTML = `

        <div class="lesson">

            <h2>🗣️ Speaking Practice</h2>

            <h3>Question 1</h3>

            <p>
                <b>Wie heißt du?</b>
            </p>

            <p>
                Ich heiße Aswin.
            </p>


            <h3>Question 2</h3>

            <p>
                <b>Woher kommst du?</b>
            </p>

            <p>
                Ich komme aus Indien.
            </p>


            <h3>Question 3</h3>

            <p>
                <b>Was sind deine Hobbys?</b>
            </p>

            <p>
                Meine Hobbys sind Fußball spielen
                und Musik hören.
            </p>


            <button
                class="complete-button"
                onclick="completeLesson('Speaking')">

                ✅ Mark Speaking as Completed

            </button>

        </div>

        `;
    }


    /* =========================
       QUIZ
    ========================= */

    else if (lesson === "quiz") {

        area.innerHTML = `

        <div class="lesson">

            <h2>📝 A1 Quiz</h2>

            <p>
                What does
                <b>"Guten Morgen"</b>
                mean?
            </p>

            <button
                class="option"
                onclick="showQuizResult(false)">

                Good night

            </button>

            <button
                class="option"
                onclick="showQuizResult(true)">

                Good morning

            </button>

            <button
                class="option"
                onclick="showQuizResult(false)">

                Goodbye

            </button>

            <p
                id="quiz-result"
                class="result">
            </p>

        </div>

        `;
    }

}


function showQuizResult(correct) {

    const result =
        document.getElementById(
            "quiz-result"
        );

    if (correct) {

        result.innerHTML =
            "✅ Correct! Sehr gut!";

        result.style.color =
            "green";

    } else {

        result.innerHTML =
            "❌ Try again!";

        result.style.color =
            "red";
    }

}

</script>

</body>
</html>
