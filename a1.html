<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschStart A1 🇩🇪</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #172033;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    font-size: 24px;
}

.hero {
    background: linear-gradient(135deg, #172033, #31456b);
    color: white;
    text-align: center;
    padding: 45px 20px;
}

.hero h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 18px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #3157a5;
    text-decoration: none;
    font-weight: bold;
}

.lesson-menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 30px;
}

.menu-button {
    background: white;
    border: none;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    font-size: 16px;
    font-weight: bold;
    color: #172033;
}

.lesson {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.lesson h2 {
    margin-bottom: 15px;
}

.lesson p {
    line-height: 1.6;
    margin-bottom: 12px;
}

.words {
    background: #eef2f8;
    padding: 15px;
    border-radius: 10px;
    line-height: 2;
}

.quiz-question {
    margin-top: 20px;
    font-weight: bold;
}

.option {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1px solid #d5dbea;
    background: white;
    border-radius: 9px;
    text-align: left;
    font-size: 16px;
}

.option:hover {
    background: #eef2f8;
}

.result {
    margin-top: 15px;
    font-weight: bold;
}

.home-button {
    display: inline-block;
    background: #ffcc00;
    color: #172033;
    padding: 13px 22px;
    border-radius: 9px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 10px;
}

footer {
    background: #172033;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

@media (max-width: 600px) {
    .lesson-menu {
        grid-template-columns: 1fr;
    }

    .hero h2 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🇩🇪 DeutschStart</h1>
</header>

<section class="hero">
    <h2>A1 German</h2>
    <p>Learn German step by step.</p>
</section>

<div class="container">

<a class="back" href="index.html">← Back to Home</a>

<h2 style="margin-bottom:15px;">📚 A1 Lessons</h2>

<div class="lesson-menu">
    <button class="menu-button" onclick="showLesson('greetings')">👋 Greetings</button>
    <button class="menu-button" onclick="showLesson('intro')">🙋 Introduction</button>
    <button class="menu-button" onclick="showLesson('numbers')">🔢 Numbers</button>
    <button class="menu-button" onclick="showLesson('family')">👨‍👩‍👧 Family</button>
    <button class="menu-button" onclick="showLesson('home')">🏠 Home</button>
    <button class="menu-button" onclick="showLesson('food')">🍎 Food</button>
    <button class="menu-button" onclick="showLesson('routine')">🕐 Daily Routine</button>
    <button class="menu-button" onclick="showLesson('grammar')">📚 Grammar</button>
    <button class="menu-button" onclick="showLesson('speaking')">🗣️ Speaking</button>
    <button class="menu-button" onclick="showLesson('quiz')">📝 A1 Quiz</button>
</div>

<div id="lesson-area">

<div class="lesson">
    <h2>👋 Welcome to A1!</h2>
    <p>Select a lesson above to start learning German.</p>
</div>

</div>

<a class="home-button" href="index.html">🏠 Home</a>

</div>

<footer>
    <p>© 2026 DeutschStart 🇩🇪</p>
    <p>Learn German A1 → B2</p>
</footer>

<script>

function showLesson(lesson) {

    const area = document.getElementById("lesson-area");

    if (lesson === "greetings") {
        area.innerHTML = `
        <div class="lesson">
            <h2>👋 Greetings</h2>
            <p>Learn common German greetings.</p>
<button onclick="completeLesson('Greetings')">
  ✅ Complete Lesson
</button>
            <div class="words">
                <b>Hallo!</b> — Hello!<br>
                <b>Guten Morgen!</b> — Good morning!<br>
                <b>Guten Tag!</b> — Good day!<br>
                <b>Guten Abend!</b> — Good evening!<br>
                <b>Gute Nacht!</b> — Good night!<br>
                <b>Auf Wiedersehen!</b> — Goodbye!
            </div>
        </div>`;
    }

    else if (lesson === "intro") {
        area.innerHTML = `
        <div class="lesson">
            <h2>🙋 Introduce Yourself</h2>

            <div class="words">
                <b>Ich heiße Aswin.</b><br>
                My name is Aswin.<br><br>

                <b>Ich bin 18 Jahre alt.</b><br>
                I am 18 years old.<br><br>

                <b>Ich komme aus Indien.</b><br>
                I come from India.<br><br>

                <b>Ich wohne in Wayanad.</b><br>
                I live in Wayanad.
            </div>
        </div>`;
    }

    else if (lesson === "numbers") {
        area.innerHTML = `
        <div class="lesson">
            <h2>🔢 Numbers 1–10</h2>

            <div class="words">
                eins — 1<br>
                zwei — 2<br>
                drei — 3<br>
                vier — 4<br>
                fünf — 5<br>
                sechs — 6<br>
                sieben — 7<br>
                acht — 8<br>
                neun — 9<br>
                zehn — 10
            </div>
        </div>`;
    }

    else if (lesson === "family") {
        area.innerHTML = `
        <div class="lesson">
            <h2>👨‍👩‍👧 Family</h2>

            <div class="words">
                die Familie — family<br>
                der Vater — father<br>
                die Mutter — mother<br>
                der Bruder — brother<br>
                die Schwester — sister<br>
                das Kind — child
            </div>
        </div>`;
    }

    else if (lesson === "home") {
        area.innerHTML = `
        <div class="lesson">
            <h2>🏠 Home</h2>

            <div class="words">
                das Haus — house<br>
                die Wohnung — apartment<br>
                das Zimmer — room<br>
                die Küche — kitchen<br>
                das Bad — bathroom<br>
                das Schlafzimmer — bedroom
            </div>
        </div>`;
    }

    else if (lesson === "food") {
        area.innerHTML = `
        <div class="lesson">
            <h2>🍎 Food</h2>

            <div class="words">
                das Brot — bread<br>
                der Reis — rice<br>
                das Wasser — water<br>
                der Kaffee — coffee<br>
                der Apfel — apple<br>
                das Essen — food
            </div>
        </div>`;
    }

    else if (lesson === "routine") {
        area.innerHTML = `
        <div class="lesson">
            <h2>🕐 Daily Routine</h2>

            <div class="words">
                <b>Ich stehe um 7 Uhr auf.</b><br>
                I get up at 7 o'clock.<br><br>

                <b>Ich frühstücke.</b><br>
                I have breakfast.<br><br>

                <b>Ich spiele Fußball.</b><br>
                I play football.<br><br>

                <b>Ich gehe um 22 Uhr schlafen.</b><br>
                I go to sleep at 10 PM.
            </div>
        </div>`;
    }

    else if (lesson === "grammar") {
        area.innerHTML = `
        <div class="lesson">
            <h2>📚 Basic Grammar</h2>

            <p><b>Personal pronouns:</b></p>

            <div class="words">
                ich — I<br>
                du — you<br>
                er — he<br>
                sie — she<br>
                es — it<br>
                wir — we<br>
                ihr — you (plural)<br>
                sie — they
            </div>

            <p style="margin-top:15px;">
                Example: <b>Ich bin Student.</b>
            </p>
        </div>`;
    }

    else if (lesson === "speaking") {
        area.innerHTML = `
        <div class="lesson">
            <h2>🗣️ Speaking Practice</h2>

            <p><b>Frage:</b> Wie heißt du?</p>
            <p><b>Antwort:</b> Ich heiße Aswin.</p>

            <p><b>Frage:</b> Woher kommst du?</p>
            <p><b>Antwort:</b> Ich komme aus Indien.</p>

            <p><b>Frage:</b> Was sind deine Hobbys?</p>
            <p><b>Antwort:</b> Meine Hobbys sind Fußball spielen und Musik hören.</p>
        </div>`;
    }

    else if (lesson === "quiz") {
        area.innerHTML = `
        <div class="lesson">
            <h2>📝 A1 Quiz</h2>

            <p class="quiz-question">
            What does "Guten Morgen" mean?
            </p>

            <button class="option" onclick="answer(false)">
            Good night
            </button>

            <button class="option" onclick="answer(true)">
            Good morning
            </button>

            <button class="option" onclick="answer(false)">
            Goodbye
            </button>

            <p id="quiz-result" class="result"></p>
        </div>`;
    }
}

function answer(correct) {

    const result = document.getElementById("quiz-result");

    if (correct) {
        result.innerHTML = "✅ Correct! Sehr gut!";
        result.style.color = "green";
    } else {
        result.innerHTML = "❌ Try again!";
        result.style.color = "red";
    }
}

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;

async function loadUser() {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
}

loadUser();
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;

async function loadUser() {
  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
}

loadUser();
</script>
    <script>
async function completeLesson(lessonName) {

  if (!currentUser) {
    alert("Please login first.");
    return;
  }

  const { error } = await supabaseClient
    .from("lesson_progress")
    .upsert({
      user_id: currentUser.id,
      lesson_name: lessonName,
      completed: true
    });

  if (error) {
    alert("Error: " + error.message);
    return;
  }

  alert("✅ Lesson completed!");
}
</script>
</body>
</html>
