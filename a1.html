<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;

let quizQuestions = [];
let currentQuestion = 0;
let quizScore = 0;


/* =========================
   LOGIN CHECK
========================= */

async function loadUser() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;
}

loadUser();


/* =========================
   COMPLETE LESSON
========================= */

async function completeLesson(lessonName) {

    if (!currentUser) {
        alert("Please login first.");
        return;
    }

    const { error } = await supabaseClient
        .from("lesson_progress")
        .upsert({
            user_id: currentUser.id,
            lesson_name: lessonName,
            completed: true
        });

    if (error) {
        alert("Error: " + error.message);
        return;
    }

    alert("✅ Lesson completed!");
}

                I am a student.<br><br>

                <b>Du bist mein Freund.</b><br>
                You are my friend.

            </div>

            <button class="complete-button"
                onclick="completeLesson('Grammar')">
                ✅ Complete Lesson
            </button>

        </div>`;
    }


    /* =========================
       SPEAKING
    ========================= */

    else if (lesson === "speaking") {

        area.innerHTML = `
        <div class="lesson">

            <h2>🗣️ Speaking Practice</h2>

            <p>
                Practice introducing yourself.
            </p>

            <div class="conversation">

                <b>Frage:</b> Wie heißt du?<br>
                <b>Antwort:</b> Ich heiße Aswin.<br><br>

                <b>Frage:</b> Wie alt bist du?<br>
                <b>Antwort:</b> Ich bin 18 Jahre alt.<br><br>

                <b>Frage:</b> Woher kommst du?<br>
                <b>Antwort:</b> Ich komme aus Indien.<br><br>

                <b>Frage:</b> Wo wohnst du?<br>
                <b>Antwort:</b> Ich wohne in Wayanad.<br><br>

                <b>Frage:</b> Was sind deine Hobbys?<br>
                <b>Antwort:</b> Meine Hobbys sind Fußball spielen und Musik hören.

            </div>

        </div>`;
    }


    /* =========================
       QUIZ
    ========================= */

    else if (lesson === "quiz") {

        startQuiz();

    }

}


/* =========================
   RANDOM QUIZ
========================= */

function startQuiz() {

    if (
        typeof A1_QUESTIONS === "undefined" ||
        !Array.isArray(A1_QUESTIONS) ||
        A1_QUESTIONS.length === 0
    ) {

        document.getElementById("lesson-area").innerHTML = `
        <div class="lesson">

            <h2>📝 A1 Quiz</h2>

            <p>
                Quiz questions could not be loaded.
            </p>

            <p>
                Please check that <b>a1-questions.js</b> is uploaded.
            </p>

        </div>`;

        return;
    }


    const shuffled = [...A1_QUESTIONS];

    for (let i = shuffled.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
        [shuffled[j], shuffled[i]];

    }


    const quizSize = Math.min(10, shuffled.length);

    quizQuestions = shuffled.slice(0, quizSize);

    currentQuestion = 0;
    quizScore = 0;

    showQuizQuestion();
}


/* =========================
   SHOW QUIZ QUESTION
========================= */

function showQuizQuestion() {

    const question = quizQuestions[currentQuestion];

    const area = document.getElementById("lesson-area");

    let optionsHTML = "";

    question.options.forEach((option, index) => {

        optionsHTML += `
        <button class="option"
            onclick="checkAnswer(${index})">
            ${option}
        </button>
        `;

    });


    area.innerHTML = `
    <div class="lesson">

        <h2>📝 A1 Quiz</h2>

        <div class="quiz-progress">
            Question ${currentQuestion + 1}
            / ${quizQuestions.length}
        </div>

        <p class="quiz-question">
            ${question.question}
        </p>

        ${optionsHTML}

        <p id="quiz-result" class="result"></p>

    </div>`;
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(selected) {

    const question = quizQuestions[currentQuestion];

    const result = document.getElementById("quiz-result");

    const buttons = document.querySelectorAll(".option");

    buttons.forEach(button => {
        button.disabled = true;
    });


    if (selected === question.answer) {

        quizScore++;

        result.innerHTML =
            "✅ Correct! Sehr gut!";

        result.style.color = "green";

    } else {

        result.innerHTML =
            "❌ Incorrect. Keep practicing!";

        result.style.color = "red";
    }


    setTimeout(() => {

        currentQuestion++;

        if (currentQuestion < quizQuestions.length) {

            showQuizQuestion();

        } else {

            finishQuiz();

        }

    }, 900);
}


/* =========================
   FINISH QUIZ
========================= */

async function finishQuiz() {

    const total = quizQuestions.length;

    const area = document.getElementById("lesson-area");

    area.innerHTML = `
    <div class="lesson">

        <h2>🎉 Quiz Finished!</h2>

        <div class="example">

            <h3>Your Score</h3>

            <p style="font-size:24px;">
                <b>${quizScore} / ${total}</b>
            </p>

        </div>

        <button class="complete-button"
            onclick="startQuiz()">
            🔄 Try Another Quiz
        </button>

    </div>`;


    if (!currentUser) {
        return;
    }


    const { error } = await supabaseClient
        .from("quiz_results")
        .insert({
            user_id: currentUser.id,
            score: quizScore,
            total: total
        });


    if (error) {

        console.log(
            "Quiz save error:",
            error.message
        );

    } else {

        console.log(
            "Quiz result saved!"
        );

    }
}

</script>
