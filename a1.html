<script>

/* =========================================================
   SUPABASE
========================================================= */

let supabaseClient = null;
let currentUser = null;

try {

    if (
        window.supabase &&
        typeof SUPABASE_URL !== "undefined" &&
        typeof SUPABASE_PUBLISHABLE_KEY !== "undefined"
    ) {

        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    }

} catch (error) {

    console.log("Supabase not available.");

}


/* =========================================================
   USER
========================================================= */

async function loadUser() {

    if (!supabaseClient) return;

    try {

        const {
            data: { user }
        } = await supabaseClient.auth.getUser();

        currentUser = user;

    } catch (error) {

        console.log(error);

    }

}

loadUser();


/* =========================================================
   LESSON COMPLETION
========================================================= */

async function completeLesson(lessonName) {

    if (!supabaseClient || !currentUser) {

        alert("Lesson completed! Please login to save your progress.");

        return;

    }

    const { error } = await supabaseClient
        .from("lesson_progress")
        .upsert({

            user_id: currentUser.id,
            lesson_name: lessonName,
            completed: true

        });

    if (error) {

        alert("Error: " + error.message);

        return;

    }

    alert("✅ Lesson completed!");

}

/* =========================================================

const ones = [
    "",
    "eins",
    "zwei",
    "drei",
    "vier",
    "fünf",
    "sechs",
    "sieben",
    "acht",
    "neun"
];

function germanNumber(n) {

    if (n === 100) return "einhundert";

    if (n < 10) return ones[n];

    if (n === 10) return "zehn";
    if (n === 11) return "elf";
    if (n === 12) return "zwölf";
    if (n === 13) return "dreizehn";
    if (n === 14) return "vierzehn";
    if (n === 15) return "fünfzehn";
    if (n === 16) return "sechzehn";
    if (n === 17) return "siebzehn";
    if (n === 18) return "achtzehn";
    if (n === 19) return "neunzehn";
    if (n === 20) return "zwanzig";
    if (n === 30) return "dreißig";
    if (n === 40) return "vierzig";
    if (n === 50) return "fünfzig";
    if (n === 60) return "sechzig";
    if (n === 70) return "siebzig";
    if (n === 80) return "achtzig";
    if (n === 90) return "neunzig";

    const tens = Math.floor(n / 10) * 10;
    const one = n % 10;

    return ones[one] + "und" + germanNumber(tens);

}


/* =========================================================
   QUESTION STORAGE
========================================================= */

const A1_QUESTIONS = [];

function addQuestion(question, correct, wrong) {

    let options = [
        correct,
        wrong[0],
        wrong[1],
        wrong[2]
    ];

    options = [...new Set(options)];

    while (options.length < 4) {
        options.push("—");
    }

    shuffle(options);

    A1_QUESTIONS.push({

        question: question,
        options: options,
        answer: correct

    });

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];

    }

    return array;

}

            .slice(0, 3)
            .map(x => x[1]);

        addQuestion(

        const wrongGerman = vocabulary
            .filter((x, i) => i !== index)
            .slice(0, 3)

/* =========================================================

========================================================= */

function generateArticleQuestions() {

    vocabulary.forEach((item, index) => {

        const word = item[0];
        const article = item[2];

        if (!article) return;

        const articles = ["der","die","das"];

        const wrong = articles.filter(x => x !== article);

        addQuestion(
            `Welcher Artikel ist richtig: ___ ${word}?`,
            article,
            wrong
        );

        addQuestion(
            `Wie heißt es richtig: „${article} ${word}“ oder ein anderer Artikel?`,
            `${article} ${word}`,
            [
                `${wrong[0]} ${word}`,
                `${wrong[1]} ${word}`,
                `kein Artikel`
            ]
        );

    });

}


/* =========================================================
   NUMBER QUESTIONS
========================================================= */

function generateNumberQuestions() {

    for (let n = 1; n <= 100; n++) {

        const correct = germanNumber(n);

        const wrongNumbers = [];

        for (let i = 1; i <= 3; i++) {

            let wrongNumber = n + i;

            if (wrongNumber > 100) {
                wrongNumber = n - i;
            }

            wrongNumbers.push(germanNumber(wrongNumber));

        }

        addQuestion(
            `Wie heißt die Zahl ${n} auf Deutsch?`,
            correct,
            wrongNumbers
        );


        const wrongDigits = [];

        for (let i = 1; i <= 3; i++) {

            let wrong = n + i;

            if (wrong > 100) {
                wrong = n - i;
            }

            wrongDigits.push(String(wrong));

        }

        addQuestion(
            `Welche Zahl bedeutet „${correct}“?`,
            String(n),
            wrongDigits
        );

    }

}

/* =========================================================
   EXTRA COMBINATION QUESTIONS
   ========================================================= */

function generateCombinationQuestions() {

    const people = [
        ["Ich","I"],
        ["Du","you"],
        ["Er","he"],
        ["Sie","she"],
        ["Wir","we"],
        ["Ihr","you plural"],
        ["Sie","they"]
    ];

    const places = [
        "zu Hause",
        "in Deutschland",
        "in Indien",
        "im Park",
        "in der Schule",
        "im Restaurant",
        "am Bahnhof",
        "im Büro",
        "in der Stadt",
        "im Supermarkt"
    ];

    const actions = [
        ["lerne","Deutsch"],
        ["spiele","Fußball"],
        ["trinke","Kaffee"],
        ["esse","Reis"],
        ["lese","ein Buch"],
        ["höre","Musik"],
        ["sehe","einen Film"],
        ["kaufe","Brot"],
        ["mache","Sport"],
        ["besuche","meine Familie"]
    ];


    people.forEach((person, pIndex) => {

        places.forEach((place, placeIndex) => {

            actions.forEach((action, actionIndex) => {

                let verb = action[0];

                if (person[0] === "Du") {

                    const map = {
                        "lerne":"lernst",
                        "spiele":"spielst",
                        "trinke":"trinkst",
                        "esse":"isst",
                        "lese":"liest",
                        "höre":"hörst",
                        "sehe":"siehst",
                        "kaufe":"kaufst",
                        "mache":"machst",
                        "besuche":"besuchst"
                    };

                    verb = map[verb] || verb;

                }

                else if (
                    person[0] === "Er" ||
                    person[0] === "Sie"
                ) {

                    const map = {
                        "lerne":"lernt",
                        "spiele":"spielt",
                        "trinke":"trinkt",
                        "esse":"isst",
                        "lese":"liest",
                        "höre":"hört",
                        "sehe":"sieht",
                        "kaufe":"kauft",
                        "mache":"macht",
                        "besuche":"besucht"
                    };

                    verb = map[verb] || verb;

                }

                else if (person[0] === "Wir") {

                    verb = action[0].replace(
                        "e","en"
                    );

                }

                else if (person[0] === "Ihr") {

                    const map = {
                        "lerne":"lernt",
                        "spiele":"spielt",
                        "trinke":"trinkt",
                        "esse":"esst",
                        "lese":"lest",
                        "höre":"hört",
                        "sehe":"seht",
                        "kaufe":"kauft",
                        "mache":"macht",
                        "besuche":"besucht"
                    };

                    verb = map[verb] || verb;

                }

                const correct =
                    `${person[0]} ${verb} ${action[1]} ${place}.`;

                addQuestion(
                    `Welche Aussage ist richtig?`,
                    correct,
                    [
                        `${person[0]} ${action[1]} ${verb} ${place}.`,
                        `${verb} ${person[0]} ${action[1]} ${place}.`,
                        `${place} ${person[0]} ${verb} ${action[1]}.`
                    ]
                );

            });

        });

    });

}

/* =========================================================

========================================================= */

function startQuiz() {

    quizQuestions =
        [...A1_QUESTIONS]
        .sort(() => Math.random() - 0.5)
        .slice(0, QUIZ_LENGTH);

    quizIndex = 0;
    quizScore = 0;
    quizAnswered = false;

    showCurrentQuestion();

}


/* =========================================================
   CURRENT QUESTION
========================================================= */

function showCurrentQuestion() {

    const area =
        document.getElementById("lesson-area");

    const q =
        quizQuestions[quizIndex];

    const progress =
        ((quizIndex) / QUIZ_LENGTH) * 100;

    let html = `

    <div class="lesson">

        <div class="quiz-top">

            <div class="badge">
                Question ${quizIndex + 1} / ${QUIZ_LENGTH}
            </div>

            <div class="badge">
                Score: ${quizScore}
            </div>

        </div>

        <div class="progress">
            <div
            class="progress-bar"
            style="width:${progress}%">
            </div>
        </div>

        <div class="quiz-question">
            ${q.question}
        </div>

    `;


    q.options.forEach(option => {

        html += `

        <button
        class="option"
        onclick="selectAnswer(this, '${escapeAttribute(option)}')">

        ${option}

        </button>

        `;

    });


    html += `

        <div
        id="quiz-feedback"
        class="quiz-feedback">
        </div>

        <button
        id="next-button"
        class="next-button"
        onclick="nextQuestion()">

        Next Question →

        </button>

    </div>

    `;

    area.innerHTML = html;

    quizAnswered = false;

}


/* =========================================================
   ESCAPE ATTRIBUTE
========================================================= */

function escapeAttribute(text) {

    return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


/* =========================================================
   ANSWER
========================================================= */

function selectAnswer(button, selected) {

    if (quizAnswered) return;

    quizAnswered = true;

    const q =
        quizQuestions[quizIndex];

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(btn => {

        btn.disabled = true;

        const text =
            btn.textContent.trim();

        if (text === q.answer) {

            btn.classList.add("correct");

        }

    });


    const feedback =
        document.getElementById("quiz-feedback");

    if (selected === q.answer) {

        quizScore++;

        button.classList.add("correct");

        feedback.innerHTML =
            "✅ Correct! Sehr gut!";

        feedback.style.color = "#16833a";

    } else {

        button.classList.add("wrong");

        feedback.innerHTML =
            "❌ Not quite. Correct answer: " +
            q.answer;

        feedback.style.color = "#c62828";

    }


    document.getElementById(
        "next-button"
    ).style.display = "inline-block";

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    quizIndex++;

    if (quizIndex >= QUIZ_LENGTH) {

        finishQuiz();

        return;

    }

    showCurrentQuestion();

}


/* =========================================================
   FINISH QUIZ
========================================================= */

async function finishQuiz() {

    const area =
        document.getElementById("lesson-area");

    const percentage =
        Math.round(
            (quizScore / QUIZ_LENGTH) * 100
        );


    let message = "";

    if (percentage === 100) {

        message = "🏆 Perfect! Sehr gut!";

    } else if (percentage >= 80) {

        message = "🎉 Excellent A1 work!";

    } else if (percentage >= 60) {

        message = "👍 Good job! Keep practicing.";

    } else {

        message = "💪 Keep practicing. You can improve!";

    }


    area.innerHTML = `

    <div class="lesson final-score">

        <h2>🎉 Quiz Finished!</h2>

        <p style="font-size:22px;">
        ${quizScore} / ${QUIZ_LENGTH}
        </p>

        <p style="font-size:20px;margin-top:10px;">
        ${percentage}%
        </p>

        <p style="margin-top:15px;">
        ${message}
        </p>

        <p style="margin-top:15px;">
        Question bank:
        <b>${A1_QUESTIONS.length.toLocaleString()}</b>
        questions
        </p>

        <button
        class="start-button"
        onclick="startQuiz()">

        🔄 Try Another Quiz

        </button>

        <br>

        <button
        class="start-button"
        onclick="showLesson('quiz')">

        📝 Back to Quiz

        </button>

    </div>

    `;


    await saveQuizResult(
        quizScore,
        QUIZ_LENGTH
    );

}


/* =========================================================
   SAVE QUIZ RESULT
========================================================= */

async function saveQuizResult(score, total) {

    if (!supabaseClient || !currentUser) {

        console.log(
            "Quiz result not saved: user not logged in."
        );

        return;

    }


    try {

        const { error } =
            await supabaseClient
            .from("quiz_results")
            .insert({

                user_id: currentUser.id,
                score: score,
                total: total

            });


        if (error) {

            console.log(
                "Quiz save error:",
                error.message
            );

        } else {

            console.log(
                "Quiz result saved!"
            );

        }

    } catch (error) {

        console.log(
            "Quiz save error:",
            error
        );

    }

}
