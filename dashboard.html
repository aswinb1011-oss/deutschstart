<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeutschStart Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .progress-section {
      margin-top: 10px;
      padding: 20px;
      border-radius: 16px;
      background: #f5f7fa;
    }

    .progress-section h3 {
      margin-bottom: 15px;
    }

    .progress-bar {
      width: 100%;
      height: 18px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
    }

    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #2563eb;
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    #progress-text {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }

    .quiz-result {
      font-size: 20px;
      font-weight: bold;
    }

    .continue-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

    .continue-button:hover {
      background: #1d4ed8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #b91c1c;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🇩🇪 DeutschStart</h1>
    <p>Student Dashboard</p>
  </header>

  <div class="container">

    <!-- USER -->
    <div class="card">
      <h2>👋 Welcome!</h2>
      <p id="user-email">Loading...</p>
    </div>

    <!-- A1 PROGRESS -->
    <div class="card">

      <div class="progress-section">
        <h3>📊 A1 Learning Progress</h3>

        <div class="progress-bar">
          <div id="progress-bar-fill"></div>
        </div>

        <p id="progress-text">0%</p>
      </div>

    </div>

    <!-- QUIZ RESULT -->
    <div class="card">
      <h2>📝 Latest Quiz Result</h2>

      <p id="quiz-result" class="quiz-result">
        Loading...
      </p>
    </div>

    <!-- CONTINUE LEARNING -->
    <div class="card">
      <h2>📚 Continue Learning</h2>

      <p>
        Continue your German A1 lessons and improve your skills.
      </p>

      <a href="a1.html" class="continue-button">
        🚀 Continue A1 Learning
      </a>
    </div>

    <!-- LOGOUT -->
    <div class="card">
      <button onclick="logout()">
        🚪 Logout
      </button>
    </div>

  </div>

  <script>

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    // -----------------------------
    // LOAD DASHBOARD
    // -----------------------------

    async function loadDashboard() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      // Show email
      document.getElementById("user-email").textContent =
        user.email;


      // -----------------------------
      // A1 LESSON PROGRESS
      // -----------------------------

      const {
        data: lessons,
        error: lessonError
      } = await supabaseClient
        .from("lesson_progress")
        .select("lesson_name, completed")
        .eq("user_id", user.id)
        .eq("completed", true);

      if (lessonError) {

        document.getElementById(
          "progress-text"
        ).textContent =
          "Error loading progress";

      } else {

        const uniqueLessons = new Set(
          (lessons || []).map(
            lesson => lesson.lesson_name
          )
        );

        const totalLessons = 7;

        let completedLessons =
          uniqueLessons.size;

        if (completedLessons > totalLessons) {
          completedLessons = totalLessons;
        }

        let percentage = Math.round(
          (completedLessons / totalLessons) * 100
        );

        if (percentage > 100) {
          percentage = 100;
        }

        document.getElementById(
          "progress-bar-fill"
        ).style.width =
          percentage + "%";

        document.getElementById(
          "progress-text"
        ).textContent =
          completedLessons +
          " / " +
          totalLessons +
          " lessons completed — " +
          percentage +
          "%";
      }


      // -----------------------------
      // QUIZ RESULT
      // -----------------------------

      const {
        data: quizzes,
        error: quizError
      } = await supabaseClient
        .from("quiz_results")
        .select("score, total")
        .eq("user_id", user.id);

      if (quizError) {

        document.getElementById(
          "quiz-result"
        ).textContent =
          "No quiz result yet.";

      } else if (
        !quizzes ||
        quizzes.length === 0
      ) {

        document.getElementById(
          "quiz-result"
        ).textContent =
          "No quiz result yet.";

      } else {

        const latestQuiz =
          quizzes[quizzes.length - 1];

        document.getElementById(
          "quiz-result"
        ).textContent =
          latestQuiz.score +
          " / " +
          latestQuiz.total;
      }
    }


    // -----------------------------
    // LOGOUT
    // -----------------------------

    async function logout() {

      const {
        error
      } = await supabaseClient.auth.signOut();

      if (error) {

        alert(
          "Logout error: " +
          error.message
        );

        return;
      }

      window.location.href =
        "login.html";
    }


    // Start dashboard
    loadDashboard();

  </script>

</body>
</html>
